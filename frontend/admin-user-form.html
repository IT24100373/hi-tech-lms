<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add / Edit User — Hi-Tech Institute LMS</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>

<nav class="navbar" id="main-navbar"></nav>
<div id="toast-container"></div>

<main class="container page-content" style="max-width:720px;">

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <a href="dashboard.html">Dashboard</a> <span class="breadcrumb-sep">/</span>
        <a href="admin-users.html">Users</a> <span class="breadcrumb-sep">/</span>
        <span id="breadcrumb-label">Add New User</span>
    </div>

    <!-- Page Header (Replacing just card header for better flow) -->
    <div class="page-header">
        <div class="page-header-left">
            <h1 id="form-title">Add New User</h1>
            <p>Modify user details and account settings</p>
        </div>
    </div>

    <div class="content-card">

        <!-- Info Banner (matches FRS screen spec) -->
        <div class="alert alert-info" style="margin-bottom:24px;">
            <span class="alert-icon">ℹ️</span>
            <span>Permissions for each role are predefined by the system. You only need to assign the correct role.</span>
        </div>

        <!-- Error banner -->
        <div class="alert alert-danger hidden" id="error-banner">
            <span class="alert-icon">⚠️</span><span id="error-text"></span>
        </div>

        <form id="user-form" novalidate>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;" class="two-col">
                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" class="form-control"
                           placeholder="e.g. Sunil Jayawardena">
                    <div class="form-error" id="fullName-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address *</label>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="instructor@hitech.edu">
                    <div class="form-error" id="email-error"></div>
                </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;" class="two-col">
                <div class="form-group">
                    <label class="form-label" for="role">Role *</label>
                    <select id="role" name="role" class="form-control">
                        <option value="">Select role...</option>
                        <option value="INSTRUCTOR">Instructor</option>
                        <option value="ADMIN">Admin</option>
                        <option value="SUPPORT_STAFF">Support Staff</option>
                        <!-- STUDENT intentionally excluded — students self-register -->
                    </select>
                    <div class="form-error" id="role-error"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phoneNumber">Phone Number <span style="color:var(--gray-400);text-transform:none;letter-spacing:0;">(Optional)</span></label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" class="form-control"
                           placeholder="07XXXXXXXX">
                    <div class="form-error" id="phoneNumber-error"></div>
                </div>
            </div>

            <!-- Password section (only in Create mode) -->
            <div id="password-section">
                <div class="section-title" style="margin-top:8px;">Password</div>

                <div class="form-group">
                    <div class="checkbox-group" style="margin-bottom:12px;">
                        <input type="checkbox" id="send-invite" name="sendInvite" checked>
                        <label for="send-invite" style="font-weight:400;text-transform:none;font-size:14px;letter-spacing:0;color:var(--text-body);">
                            Send email invitation — user sets their own password
                        </label>
                    </div>
                </div>

                <div class="form-group" id="temp-password-group" style="display:none;">
                    <label class="form-label" for="temporaryPassword">Set Temporary Password</label>
                    <div class="input-group">
                        <input type="password" id="temporaryPassword" name="temporaryPassword"
                               class="form-control" placeholder="Min 8 chars, 1 uppercase, 1 digit, 1 special">
                        <button type="button" class="input-toggle" id="toggle-temp-pwd">👁</button>
                    </div>
                    <div class="strength-bar mt-2"><div class="strength-bar-fill" id="strength-fill"></div></div>
                    <div class="strength-label text-sm" id="strength-label"></div>
                    <div class="form-error" id="temporaryPassword-error"></div>
                </div>
            </div>

            <!-- Form Actions -->
            <div style="margin-top:24px;display:flex;gap:12px;padding-top:16px;border-top:1px solid var(--border-subtle);">
                <button type="submit" class="btn btn-primary" id="save-btn">Save User</button>
                <a href="admin-users.html" class="btn btn-secondary" id="cancel-btn">Cancel</a>
            </div>

        </form>
    </div>
</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-copy">&copy; 2026 Hi-Tech Institute. All rights reserved.</div>
        <div class="footer-links">
            <a href="#">Support</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </div>
</footer>

<script src="js/common.js"></script>
<script>
    requireAuth();
    if (getUserRole() !== 'ADMIN') { window.location.href = 'dashboard.html'; }
    buildNavbar('users');

    const params = new URLSearchParams(window.location.search);
    const editId = params.get('id'); // null = create mode, number = edit mode
    const isEdit = !!editId;

    if (isEdit) {
        document.getElementById('breadcrumb-label').textContent = 'Edit User';
        document.getElementById('form-title').textContent = 'Edit User';
        document.getElementById('save-btn').textContent = 'Save Changes';
        document.getElementById('password-section').style.display = 'none';
        loadUserForEdit(editId);
    }

    // Show/hide temp password field based on checkbox
    document.getElementById('send-invite').addEventListener('change', function() {
        document.getElementById('temp-password-group').style.display = this.checked ? 'none' : 'block';
    });

    document.getElementById('toggle-temp-pwd')?.addEventListener('click', function() {
        const f = document.getElementById('temporaryPassword');
        f.type = f.type === 'password' ? 'text' : 'password';
        this.textContent = f.type === 'password' ? '👁' : '🙈';
    });

    document.getElementById('temporaryPassword')?.addEventListener('input', function() {
        updatePasswordStrength(this.value, document.getElementById('strength-fill'), document.getElementById('strength-label'));
    });

    async function loadUserForEdit(id) {
        try {
            const res = await apiCall(`/admin/users/${id}`);
            const u = res.data;
            document.getElementById('fullName').value   = u.fullName;
            document.getElementById('email').value      = u.email;
            document.getElementById('email').readOnly   = true; // Cannot change email
            document.getElementById('role').value       = u.role;
            document.getElementById('phoneNumber').value = u.phoneNumber || '';
        } catch (err) {
            showToast('Failed to load user: ' + err.message, 'error');
        }
    }

    document.getElementById('user-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        clearAllErrors(this);
        hide(document.getElementById('error-banner'));

        const fullName    = document.getElementById('fullName').value.trim();
        const email       = document.getElementById('email').value.trim();
        const role        = document.getElementById('role').value;
        const phoneNumber = document.getElementById('phoneNumber').value.trim();
        const sendInvite  = document.getElementById('send-invite')?.checked;
        const tempPwd     = document.getElementById('temporaryPassword')?.value;
        const saveBtn     = document.getElementById('save-btn');

        // Validation
        let valid = true;
        if (!fullName) { showFieldError(document.getElementById('fullName'), 'Full name is required'); valid = false; }
        if (!email)    { showFieldError(document.getElementById('email'),    'Email is required');     valid = false; }
        if (!isEdit && !role) { showFieldError(document.getElementById('role'), 'Role is required');  valid = false; }
        if (phoneNumber && !/^(07\d{8}|7\d{8})$/.test(phoneNumber)) {
            showFieldError(document.getElementById('phoneNumber'), 'Phone must start with 07 (10 digits) or 7 (9 digits)');
            valid = false;
        }
        if (!valid) return;

        setLoading(saveBtn, true, 'Saving...');

        try {
            if (isEdit) {
                await apiCall(`/admin/users/${editId}`, {
                    method: 'PATCH',
                    body: { fullName, phoneNumber: phoneNumber || null, role }
                });
                showToast('User updated successfully!', 'success');
            } else {
                await apiCall('/admin/users', {
                    method: 'POST',
                    body: {
                        fullName, email, role,
                        phoneNumber: phoneNumber || null,
                        temporaryPassword: (!sendInvite && tempPwd) ? tempPwd : null
                    }
                });
                showToast('User created! A welcome email has been sent.', 'success');
            }
            setTimeout(() => { window.location.href = 'admin-users.html'; }, 1200);

        } catch (err) {
            setLoading(saveBtn, false);
            if (err.data?.data) showApiErrors(this, err.data.data);
            document.getElementById('error-text').textContent = err.message || 'Save failed.';
            show(document.getElementById('error-banner'));
        }
    });
</script>
</body>
</html>
