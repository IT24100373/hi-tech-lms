<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Ledger — Hi-Tech LMS</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    /* Detail drawer */
    .overlay { position:fixed; inset:0; background:rgba(15,23,42,0.4); backdrop-filter:blur(4px); z-index:998; display:none; }
    .detail-drawer {
      position:fixed; right:0; top:0; bottom:0; width:480px; background:var(--card-bg);
      box-shadow:-10px 0 40px rgba(0,0,0,.15); z-index:999;
      overflow-y:auto; padding:40px;
      transform:translateX(100%); transition:transform .3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .detail-drawer.open { transform:translateX(0); }
    .drawer-close {
      position:absolute; top:24px; right:24px; background:var(--page-bg);
      border:none; width:40px; height:40px; border-radius:50%; font-size:20px; cursor:pointer; color:var(--text-muted); display:flex; align-items:center; justify-content:center; transition:background 0.2s, color 0.2s;
    }
    .drawer-close:hover { background:var(--border-light); color:var(--text-primary); }
    .detail-row {
      display:flex; justify-content:space-between; padding:16px 0;
      border-bottom:1px solid var(--border-light);
    }
    .detail-row:last-child { border-bottom:none; }
    .detail-row .lbl { font-size:13px; font-weight:600; color:var(--text-muted); flex-shrink:0; text-transform:uppercase; letter-spacing:0.05em; }
    .detail-row .val {
      font-size:14px; font-weight:600; color:var(--text-primary);
      text-align:right; max-width:65%; word-break:break-all; line-height:1.4;
    }
    @media(max-width:560px){ .detail-drawer { width:100%; padding:32px 24px; } }
  </style>
</head>
<body>
<nav class="navbar" id="main-navbar"></nav>
<div id="toast-container"></div>

<!-- Overlay + Drawer -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="detail-drawer" id="drawer">
  <button class="drawer-close" onclick="closeDrawer()">✕</button>
  <h2 style="font-size:22px;font-weight:800;color:var(--text-primary);margin-bottom:8px;">Transaction Detail</h2>
  <p style="font-size:14px;color:var(--text-muted);margin-bottom:32px;">Complete record for this payment.</p>
  <div id="drawer-body"></div>
</div>

<main class="container page-content">
  <div class="page-header">
    <div class="page-header-left">
      <h1>Transaction Ledger</h1>
      <p>Complete record of all payment transactions</p>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <a href="dashboard.html" class="btn btn-secondary outline">← Back to Dashboard</a>
      <button class="btn btn-primary" onclick="exportCSV()">📥 Export CSV</button>
    </div>
  </div>

  <div class="content-card" style="padding:0;">
    <!-- Filters -->
    <div class="filter-bar" style="border-radius:16px 16px 0 0; border:none; border-bottom:1px solid var(--border-subtle); padding:16px 24px;">
      <input type="text" id="f-search" class="form-control search-input" placeholder="🔍 Name or email…" style="max-width:220px;" oninput="debounce()">
      <select id="f-status" class="form-control" onchange="loadPage(0)" style="max-width:160px;">
        <option value="">All Statuses</option>
        <option value="SUCCESS">Completed</option>
        <option value="FAILED">Failed</option>
      </select>
      <input type="date" id="f-from" class="form-control" title="From Date" onchange="loadPage(0)" style="max-width:160px;">
      <input type="date" id="f-to" class="form-control" title="To Date" onchange="loadPage(0)" style="max-width:160px;">
      <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Reset</button>
    </div>

    <div style="padding:16px 24px; border-bottom:1px solid var(--border-subtle); background:var(--card-bg);">
      <p id="result-summary" style="font-size:13px;font-weight:600;color:var(--text-muted);"></p>
    </div>

    <div id="table-wrap">
      <div class="empty-state">
        <p class="empty-state-title" style="font-size:18px;">Loading…</p>
      </div>
    </div>

    <div class="pagination" id="pagination" style="display:flex; border-top:1px solid var(--border-subtle); border-radius:0 0 16px 16px;">
    </div>
  </div>
</main>

<footer class="site-footer" style="margin-top:60px;">
  <div class="container">
      <div class="footer-copy">&copy; 2026 Hi-Tech Institute. All rights reserved.</div>
      <div class="footer-links">
          <a href="#">Support</a>
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
      </div>
  </div>
</footer>

<script src="js/common.js"></script>
<script>
  requireAuth();
  const r = getUserRole();
  if (r !== 'ADMIN' && r !== 'STUDENT') window.location.href = 'dashboard.html';
  buildNavbar('finance');

  if (r === 'STUDENT') {
    document.querySelector('.page-header-left p').textContent = 'Complete record of your payment transactions';
    const exportBtn = document.querySelector('button[onclick="exportCSV()"]');
    if (exportBtn) exportBtn.style.display = 'none';
    const filterBar = document.querySelector('.filter-bar');
    if (filterBar) filterBar.style.display = 'none';
  }

  // Pre-fill status filter from URL
  const urlP = new URLSearchParams(location.search);
  if (urlP.get('status')) document.getElementById('f-status').value = urlP.get('status');

  loadPage(0);

  let debTimer;
  function debounce() {
    clearTimeout(debTimer);
    debTimer = setTimeout(() => loadPage(0), 400);
  }

  async function loadPage(page) {
    let endpoint = '';
    const r = getUserRole();

    if (r === 'STUDENT') {
      endpoint = `/payments/my-payments?page=${page}&size=20`;
    } else {
      const search = document.getElementById('f-search').value.trim();
      const status = document.getElementById('f-status').value;
      const from   = document.getElementById('f-from').value;
      const to     = document.getElementById('f-to').value;

      endpoint = `/admin/finance/transactions?page=${page}&size=20`;
      if (search) endpoint += `&search=${encodeURIComponent(search)}`;
      if (status) endpoint += `&status=${status}`;
      if (from)   endpoint += `&from=${from}`;
      if (to)     endpoint += `&to=${to}`;
    }

    const wrap = document.getElementById('table-wrap');
    wrap.innerHTML = '<div class="empty-state"><p class="empty-state-title" style="font-size:18px;">Loading…</p></div>';

    try {
      const resp = await apiCall(endpoint);
      const { content, totalElements, totalPages, number } = resp.data;

      document.getElementById('result-summary').textContent =
              `${totalElements} transaction${totalElements !== 1 ? 's' : ''}`;

      if (!content.length) {
        wrap.innerHTML = `<div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p class="empty-state-title" style="font-size:20px;">No transactions found.</p>
            <p class="empty-state-sub">Try adjusting your filters.</p>
          </div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      wrap.innerHTML = `<div class="table-wrapper">
          <table class="content-table" style="margin:0;">
            <thead><tr>
              <th style="padding-left:24px;">Date &amp; Time</th><th>Student</th><th>Course</th>
              <th>Amount</th><th>Status</th><th>Reference</th>
              <th>Invoice</th><th style="padding-right:24px;"></th>
            </tr></thead>
            <tbody>${content.map(r => `<tr>
              <td style="font-size:12px;white-space:nowrap;padding-left:24px;color:var(--text-muted);">${fmtDate(r.paidAt)}</td>
              <td>
                <div style="font-weight:600;color:var(--text-primary);">${r.studentName}</div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${r.studentEmail}</div>
              </td>
              <td>
                <div style="font-weight:500;color:var(--text-body);">${r.courseTitle}</div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${r.courseCode}</div>
              </td>
              <td style="font-weight:800;color:var(--text-primary);">${r.currency} ${Number(r.amount).toFixed(2)}</td>
              <td>${getPaymentStatusBadge(r.status)}</td>
              <td>
                <code style="font-size:11px;background:var(--page-bg);padding:4px 8px;border-radius:6px;color:var(--text-muted);border:1px solid var(--border-light);">
                  ${(r.gatewayReference||'').substring(0,18)}…
                </code>
              </td>
              <td>${r.invoiceId
              ? `<a href="finance-invoice.html?id=${r.invoiceId}" target="_blank"
                     class="btn btn-sm btn-secondary outline" title="${r.invoiceNumber}" style="padding:4px 10px;font-size:16px;">🧾</a>`
              : '<span style="color:var(--border-light);font-weight:700;">—</span>'}</td>
              <td style="padding-right:24px;">
                <button class="btn btn-sm btn-secondary outline" onclick="openDrawer(${r.id})">View</button>
              </td>
            </tr>`).join('')}
            </tbody>
          </table>
        </div>`;

      renderPagination(number, totalPages);
    } catch (err) {
      wrap.innerHTML = `<p style="padding:48px;text-align:center;color:var(--danger);">Error: ${err.message}</p>`;
    }
  }

  function renderPagination(current, total) {
    const el = document.getElementById('pagination');
    el.innerHTML = '';
    if (total <= 1) return;
    
    let html = `<div class="pagination-controls" style="margin:16px auto;">`;
    if (current > 0) {
      html += `<button class="page-btn" onclick="loadPage(${current-1})">‹</button>`;
    } else {
      html += `<button class="page-btn" disabled>‹</button>`;
    }
    html += `<div class="pagination-controls" style="margin:0 8px;">`;
    const start = Math.max(0, current - 2), end = Math.min(total, start + 5);
    for (let i = start; i < end; i++) {
        html += `<button class="page-btn ${i===current?'active':''}" onclick="loadPage(${i})">${i+1}</button>`;
    }
    html += `</div>`;
    if (current < total-1) {
      html += `<button class="page-btn" onclick="loadPage(${current+1})">›</button>`;
    } else {
      html += `<button class="page-btn" disabled>›</button>`;
    }
    html += `</div>`;
    el.innerHTML = html;
  }

  async function openDrawer(paymentId) {
    try {
      const endpoint = (getUserRole() === 'ADMIN')
          ? `/admin/finance/transactions/${paymentId}`
          : `/payments/${paymentId}`;
      const resp = await apiCall(endpoint);
      const r = resp.data;
      document.getElementById('drawer-body').innerHTML = `
          <div style="margin-bottom:24px;">
            ${getPaymentStatusBadge(r.status)}
          </div>
          <div style="background:var(--page-bg);border:1px solid var(--border-light);border-radius:12px;padding:24px;">
            ${dRow('Date & Time', fmtDate(r.paidAt))}
            ${dRow('Student', `<span style="font-weight:700;">${r.studentName}</span><br><span style="color:var(--text-muted);font-weight:500;">${r.studentEmail}</span>`)}
            ${dRow('Course', `<span style="font-weight:700;">${r.courseTitle}</span><br><span style="color:var(--text-muted);font-weight:500;">${r.courseCode}</span>`)}
            ${dRow('Amount', `<span style="font-size:18px;font-weight:800;color:var(--brand-primary);">${r.currency} ${Number(r.amount).toFixed(2)}</span>`)}
            ${dRow('Method', r.paymentMethod || '—')}
            ${dRow('Card', r.cardBrand && r.cardLastFour ? r.cardBrand + ' ending ' + r.cardLastFour : '—')}
            ${dRow('Gateway Ref', `<code style="font-size:12px;word-break:break-all;background:var(--card-bg);padding:4px 8px;border-radius:6px;border:1px solid var(--border-light);color:var(--text-muted);">${r.gatewayReference}</code>`)}
            ${r.failureReason ? dRow('Failure Reason', `<span style="color:var(--danger);">${r.failureReason}</span>`) : ''}
          </div>
          ${r.invoiceId ? `<div style="margin-top:24px;">
            <a href="finance-invoice.html?id=${r.invoiceId}" target="_blank"
               class="btn btn-secondary outline" style="width:100%;text-align:center;padding:12px;font-weight:700;">
              🧾 View Invoice ${r.invoiceNumber}
            </a></div>` : ''}`;

      document.getElementById('drawer').classList.add('open');
      document.getElementById('overlay').style.display = 'block';
    } catch (err) {
      showToast('Failed to load transaction: ' + err.message, 'error');
    }
  }

  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('overlay').style.display = 'none';
  }

  function dRow(label, value) {
    return `<div class="detail-row">
        <span class="lbl">${label}</span>
        <span class="val">${value}</span>
      </div>`;
  }

  function clearFilters() {
    ['f-search','f-from','f-to'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-status').value = '';
    loadPage(0);
  }

  async function exportCSV() {
    try {
      const search = document.getElementById('f-search').value;
      const status = document.getElementById('f-status').value;
      const from   = document.getElementById('f-from').value;
      const to     = document.getElementById('f-to').value;

      let endpoint = '/admin/finance/transactions?page=0&size=9999';
      if (search) endpoint += `&search=${encodeURIComponent(search)}`;
      if (status) endpoint += `&status=${status}`;
      if (from)   endpoint += `&from=${from}`;
      if (to)     endpoint += `&to=${to}`;

      const resp = await apiCall(endpoint);
      const rows = resp.data.content;
      const csv = [
        'Date,Student Name,Student Email,Course,Course Code,Amount,Currency,Status,Card,Reference,Invoice'
      ].concat(rows.map(r =>
              [fmtDate(r.paidAt), r.studentName, r.studentEmail,
                r.courseTitle, r.courseCode, r.amount, r.currency, r.status,
                (r.cardBrand||'') + ' *' + (r.cardLastFour||''),
                r.gatewayReference, r.invoiceNumber||''].join(',')
      )).join('\n');

      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      a.download = `transactions-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    } catch (err) {
      showToast('Export failed: ' + err.message, 'error');
    }
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('en-GB', {
      day:'2-digit', month:'short', year:'numeric',
      hour:'2-digit', minute:'2-digit'
    });
  }
</script>
</body>
</html>
